<svg
  width="1200"
  height="155"
  viewBox="0 0 1200 155"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0712"/>
      <stop offset="55%" stop-color="#08040D"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- MAIN PANEL -->

  <rect
    x="2"
    y="2"
    width="1196"
    height="151"
    rx="14"
    fill="url(#panelBg)"
    stroke="#A855F7"
    stroke-width="2"
  />


  <!-- INNER BORDER -->

  <rect
    x="12"
    y="12"
    width="1176"
    height="131"
    rx="10"
    fill="none"
    stroke="#5F3475"
    stroke-width="1"
    opacity="0.45"
  />


  <!-- TERMINAL DOTS -->

  <circle cx="31" cy="29" r="4" fill="#A855F7"/>

  <circle
    cx="47"
    cy="29"
    r="4"
    fill="#D8B4FE"
    opacity="0.75"
  />

  <circle
    cx="63"
    cy="29"
    r="4"
    fill="#76558C"
  />


  <!-- TOP LABEL -->

  <text
    x="600"
    y="33"
    text-anchor="middle"
    fill="#76558C"
    font-family="monospace"
    font-size="10"
    font-weight="bold"
    letter-spacing="3"
  >
    GITHUB // PLAYER RECORD
  </text>


  <!-- LIVE -->

  <circle
    cx="1120"
    cy="29"
    r="3"
    fill="#A855F7"
    filter="url(#glow)"
  />

  <text
    x="1133"
    y="33"
    fill="#76558C"
    font-family="monospace"
    font-size="9"
    font-weight="bold"
  >
    LIVE
  </text>


  <!-- MAIN TITLE -->

  <text
    x="55"
    y="83"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="24"
    font-weight="bold"
  >
    PLAYER RECORD
  </text>


  <!-- SUBTITLE -->

  <text
    x="55"
    y="108"
    fill="#76558C"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    COMMITS // LANGUAGES // ACTIVITY
  </text>


  <!-- RIGHT HUD -->

  <rect
    x="800"
    y="63"
    width="330"
    height="48"
    rx="6"
    fill="#12091A"
    stroke="#3D2050"
  />

  <text
    x="820"
    y="84"
    fill="#76558C"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    PROFILE
  </text>

  <text
    x="820"
    y="101"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
  >
    ANUSHKA-HIYU
  </text>


  <!-- STATUS -->

  <circle
    cx="55"
    cy="132"
    r="3"
    fill="#A855F7"
    filter="url(#glow)"
  />

  <text
    x="68"
    y="136"
    fill="#5F3475"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    DATA://SYNC
  </text>


  <text
    x="1130"
    y="136"
    text-anchor="end"
    fill="#5F3475"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    PLAYER_01
  </text>

</svg>
