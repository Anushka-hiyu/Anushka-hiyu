<svg
  width="760"
  height="300"
  viewBox="0 0 760 300"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0712"/>
      <stop offset="55%" stop-color="#08040D"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect
    x="1"
    y="1"
    width="758"
    height="298"
    rx="14"
    fill="url(#panelBg)"
    stroke="#A855F7"
    stroke-width="2"
  />

  <rect
    x="10"
    y="10"
    width="740"
    height="280"
    rx="10"
    fill="none"
    stroke="#5F3475"
    stroke-width="1"
    opacity="0.45"
  />


  <!-- TERMINAL DOTS -->

  <circle cx="28" cy="27" r="4" fill="#A855F7"/>
  <circle cx="44" cy="27" r="4" fill="#D8B4FE" opacity="0.75"/>
  <circle cx="60" cy="27" r="4" fill="#76558C"/>


  <!-- HEADER -->

  <text
