<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0712"/>
      <stop offset="55%" stop-color="#08040D"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- MAIN PANEL -->

  <rect
    x="3"
    y="3"
    width="1194"
    height="354"
    rx="20"
    fill="url(#panelBg)"
    stroke="#A855F7"
    stroke-width="3"
  />

  <!-- INNER BORDER -->

  <rect
    x="14"
    y="14"
    width="1172"
    height="332"
    rx="15"
    fill="none"
    stroke="#5F3475"
    stroke-width="1"
    opacity="0.5"
  />


  <!-- TERMINAL DOTS -->

  <circle cx="34" cy="34" r="5" fill="#A855F7"/>
  <circle cx="53" cy="34" r="5" fill="#D8B4FE" opacity="0.75"/>
  <circle cx="72" cy="34" r="5" fill="#76558C"/>


  <!-- HEADER -->

  <text
    x="600"
    y="39"
    text-anchor="middle"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
    letter-spacing="3"
  >
    CONTRIBUTION // RUN
  </text>


  <!-- LIVE -->

  <circle
    cx="1115"
    cy="34"
    r="4"
    fill="#A855F7"
    filter="url(#glow)"
  />

  <text
    x="1128"
    y="38"
    fill="#76558C"
    font-family="monospace"
    font-size="10"
    font-weight="bold"
  >
    LIVE
  </text>


  <!-- DIVIDER -->

  <line
    x1="28"
    y1="58"
    x2="1172"
    y2="58"
    stroke="#24132F"
  />


  <!-- GAME AREA LABEL -->

  <text
    x="42"
    y="88"
    fill="#A855F7"
    font-family="monospace"
    font-size="10"
    font-weight="bold"
    letter-spacing="2"
  >
    RUN_01
  </text>

  <text
    x="1158"
    y="88"
    text-anchor="end"
    fill="#5F3475"
    font-family="monospace"
    font-size="9"
  >
    HIGH SCORE // ∞
  </text>


  <!-- GAME SLOT -->

  <rect
    x="32"
    y="103"
    width="1136"
    height="155"
    rx="8"
    fill="#050308"
    stroke="#24132F"
    stroke-width="1"
  />


  <!-- CHICK RUN IMAGE -->

  <image
    href="chick-run.gif"
    x="32"
    y="103"
    width="1136"
    height="155"
    preserveAspectRatio="xMidYMid meet"
  />


  <!-- LOWER DIVIDER -->

  <line
    x1="32"
    y1="278"
    x2="1168"
    y2="278"
    stroke="#24132F"
  />


  <!-- SPACE -->

  <rect
    x="45"
    y="298"
    width="120"
    height="38"
    rx="6"
    fill="#12091A"
    stroke="#A855F7"
    stroke-width="1.5"
  />

  <text
    x="105"
    y="322"
    text-anchor="middle"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
  >
    SPACE
  </text>

  <text
    x="182"
    y="322"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
  >
    JUMP
  </text>


  <!-- RUN -->

  <rect
    x="325"
    y="298"
    width="105"
    height="38"
    rx="6"
    fill="#12091A"
    stroke="#A855F7"
    stroke-width="1.5"
  />

  <text
    x="377.5"
    y="322"
    text-anchor="middle"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
  >
    RUN
  </text>

  <text
    x="447"
    y="322"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
  >
    BUILD
  </text>


  <!-- OBJECTIVE -->

  <text
    x="700"
    y="310"
    fill="#76558C"
    font-family="monospace"
    font-size="9"
    font-weight="bold"
    letter-spacing="2"
  >
    OBJECTIVE
  </text>

  <text
    x="700"
    y="330"
    fill="#A855F7"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
    filter="url(#softGlow)"
  >
    DON'T HIT THE BUGS
  </text>


  <!-- STATUS -->

  <text
    x="1155"
    y="325"
    text-anchor="end"
    fill="#5F3475"
    font-family="monospace"
    font-size="9"
  >
    STATUS://RUNNING
  </text>

</svg>
