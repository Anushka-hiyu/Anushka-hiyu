
<svg width="900" height="390" viewBox="0 0 900 390"
xmlns="http://www.w3.org/2000/svg">

<defs>
<filter id="glow">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>

<rect width="900" height="390" rx="14" fill="#050308"/>

<rect x="2" y="2" width="896" height="386"
rx="14"
fill="none"
stroke="#A855F7"
stroke-width="2"/>

<text x="450" y="48"
text-anchor="middle"
fill="#A855F7"
font-family="monospace"
font-size="24"
font-weight="bold">
CARD_GAMES.EXE
</text>

<text x="450" y="73"
text-anchor="middle"
fill="#76558C"
font-family="monospace"
font-size="11">
WAR // BLACKJACK // JACKERS
</text>

<!-- LEFT CARD -->

<g transform="translate(105 110) rotate(-6 90 115)">

<rect width="180" height="230" rx="13"
fill="#0C0810"
stroke="#D8B4FE"
stroke-width="2"/>

<text x="20" y="38"
fill="#D8B4FE"
font-family="serif"
font-size="30">A</text>

<text x="22" y="70"
fill="#A855F7"
font-size="30">♠</text>

<text x="90" y="135"
text-anchor="middle"
fill="#A855F7"
font-size="72"
filter="url(#glow)">♠</text>

<text x="160" y="210"
text-anchor="end"
fill="#D8B4FE"
font-family="serif"
font-size="30">A</text>

</g>


<!-- CENTER -->

<text x="450" y="145"
text-anchor="middle"
fill="#76558C"
font-family="monospace"
font-size="12">
ORIGINAL CONCEPT
</text>

<text x="450" y="195"
text-anchor="middle"
fill="#F5F0FA"
font-family="monospace"
font-weight="bold"
font-size="38"
filter="url(#glow)">
JACKERS
</text>

<rect x="355" y="220"
width="190"
height="42"
rx="5"
fill="#12081A"
stroke="#A855F7"/>

<text x="450" y="246"
text-anchor="middle"
fill="#D8B4FE"
font-family="monospace"
font-size="12">
[ ORIGINAL // UNLOCKED ]
</text>

<text x="450" y="305"
text-anchor="middle"
fill="#6E4A82"
font-family="monospace"
font-size="11">
DEAL THE NEXT HAND_
</text>


<!-- RIGHT CARD -->

<g transform="translate(615 110) rotate(6 90 115)">

<rect width="180" height="230" rx="13"
fill="#0C0810"
stroke="#A855F7"
stroke-width="2"/>

<text x="20" y="38"
fill="#D8B4FE"
font-family="serif"
font-size="30">J</text>

<text x="22" y="70"
fill="#A855F7"
font-size="30">♥</text>

<text x="90" y="135"
text-anchor="middle"
fill="#A855F7"
font-size="72"
filter="url(#glow)">♥</text>

<text x="160" y="210"
text-anchor="end"
fill="#D8B4FE"
font-family="serif"
font-size="30">J</text>

</g>

</svg>
