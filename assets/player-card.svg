<svg
  width="760"
  height="330"
  viewBox="0 0 760 330"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Main purple glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tiny softer glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background gradient -->
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0712"/>
      <stop offset="55%" stop-color="#08040D"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

  </defs>


  <!-- ===================== -->
  <!-- BACKGROUND            -->
  <!-- ===================== -->

  <rect
    x="1"
    y="1"
    width="758"
    height="328"
    rx="16"
    fill="url(#panelBg)"
    stroke="#A855F7"
    stroke-width="2"
  />

  <!-- inner border -->

  <rect
    x="10"
    y="10"
    width="740"
    height="310"
    rx="11"
    fill="none"
    stroke="#5F3475"
    stroke-width="1"
    opacity="0.55"
  />


  <!-- ===================== -->
  <!-- WINDOW HEADER         -->
  <!-- ===================== -->

  <!-- window buttons -->

  <circle cx="30" cy="29" r="5" fill="#A855F7"/>
  <circle cx="48" cy="29" r="5" fill="#D8B4FE" opacity="0.75"/>
  <circle cx="66" cy="29" r="5" fill="#76558C"/>

  <text
    x="380"
    y="34"
    text-anchor="middle"
    fill="#76558C"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
    letter-spacing="2"
  >
    ANUSHKA.EXE // PLAYER TERMINAL
  </text>

  <!-- online indicator -->

  <circle
    cx="704"
    cy="29"
    r="4"
    fill="#A855F7"
    filter="url(#glow)"
  />

  <text
    x="716"
    y="33"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="9"
  >
    ONLINE
  </text>


  <!-- header divider -->

  <line
    x1="22"
    y1="50"
    x2="738"
    y2="50"
    stroke="#24132F"
    stroke-width="1"
  />


  <!-- ===================== -->
  <!-- TITLE                 -->
  <!-- ===================== -->

  <text
    x="42"
    y="94"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="30"
    font-weight="bold"
    letter-spacing="2"
    filter="url(#softGlow)"
  >
    ANUSHKA.EXE
  </text>

  <text
    x="44"
    y="120"
    fill="#76558C"
    font-family="monospace"
    font-size="10"
  >
    C:\Users\Anushka&gt; initialize_player.exe
  </text>


  <!-- ===================== -->
  <!-- PLAYER INFORMATION    -->
  <!-- ===================== -->

  <text
    x="44"
    y="163"
    fill="#A855F7"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
  >
    PLAYER
  </text>

  <text
    x="150"
    y="163"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
  >
    ANUSHKA
  </text>


  <text
    x="44"
    y="190"
    fill="#A855F7"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
  >
    CLASS
  </text>

  <text
    x="150"
    y="190"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
  >
    COMPUTER SCIENCE
  </text>


  <text
    x="44"
    y="217"
    fill="#A855F7"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
  >
    LEVEL
  </text>

  <text
    x="150"
    y="217"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
  >
    THIRD YEAR
  </text>


  <text
    x="44"
    y="244"
    fill="#A855F7"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
  >
    MODE
  </text>

  <text
    x="150"
    y="244"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
  >
    BUILDING
  </text>


  <!-- ===================== -->
  <!-- RIGHT STATUS PANEL    -->
  <!-- ===================== -->

  <rect
    x="425"
    y="142"
    width="285"
    height="103"
    rx="8"
    fill="#07050D"
    stroke="#24132F"
    stroke-width="1"
  />

  <text
    x="447"
    y="169"
    fill="#76558C"
    font-family="monospace"
    font-size="9"
    font-weight="bold"
    letter-spacing="1"
  >
    PROFILE LOADED
  </text>

  <!-- loading bar background -->

  <rect
    x="447"
    y="185"
    width="240"
    height="7"
    rx="3.5"
    fill="#24132F"
  />

  <!-- loading bar -->

  <rect
    x="447"
    y="185"
    width="240"
    height="7"
    rx="3.5"
    fill="#A855F7"
    filter="url(#glow)"
  />

  <text
    x="447"
    y="216"
    fill="#76558C"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    GAMES // MUSIC // BOOKS // WEB
  </text>

  <text
    x="447"
    y="237"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="10"
    font-weight="bold"
  >
    &gt; PRESS START
  </text>


  <!-- ===================== -->
  <!-- FOOTER                -->
  <!-- ===================== -->

  <line
    x1="22"
    y1="276"
    x2="738"
    y2="276"
    stroke="#24132F"
    stroke-width="1"
  />

  <text
    x="42"
    y="302"
    fill="#5F3475"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    SYSTEM:// READY
  </text>

  <text
    x="718"
    y="302"
    text-anchor="end"
    fill="#5F3475"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    BUILD_01
  </text>

</svg>
