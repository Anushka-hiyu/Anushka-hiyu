
<svg width="850" height="72" viewBox="0 0 850 72"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="850" height="72" rx="9" fill="#050308"/>

  <rect
    x="1"
    y="1"
    width="848"
    height="70"
    rx="9"
    fill="none"
    stroke="#3D2050"
  />

  <!-- SPACE -->

  <rect
    x="35"
    y="19"
    width="100"
    height="34"
    rx="4"
    fill="#0D0712"
    stroke="#A855F7"
  />

  <text
    x="85"
    y="41"
    text-anchor="middle"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
  >
    SPACE
  </text>

  <text
    x="150"
    y="41"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="12"
    letter-spacing="1"
  >
    JUMP
  </text>


  <!-- RUN -->

  <rect
    x="290"
    y="19"
    width="78"
    height="34"
    rx="4"
    fill="#0D0712"
    stroke="#A855F7"
  />

  <text
    x="329"
    y="41"
    text-anchor="middle"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
  >
    RUN
  </text>

  <text
    x="383"
    y="41"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="12"
    letter-spacing="1"
  >
    BUILD
  </text>


  <!-- OBJECTIVE -->

  <text
    x="555"
    y="31"
    fill="#76558C"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    OBJECTIVE
  </text>

  <text
    x="555"
    y="48"
    fill="#A855F7"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
    letter-spacing="1"
    filter="url(#glow)"
  >
    DON'T HIT THE BUGS
  </text>

</svg>
