<svg
  width="850"
  height="340"
  viewBox="0 0 850 340"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect
    width="850"
    height="340"
    rx="14"
    fill="#050308"
  />

  <rect
    x="12"
    y="12"
    width="826"
    height="316"
    rx="11"
    fill="#08040D"
  />

  <rect
    x="2"
    y="2"
    width="846"
    height="336"
    rx="14"
    fill="none"
    stroke="#A855F7"
    stroke-width="2"
  />


  <!-- TOP BAR -->

  <circle cx="28" cy="28" r="4" fill="#A855F7"/>
  <circle cx="44" cy="28" r="4" fill="#5F3475"/>
  <circle cx="60" cy="28" r="4" fill="#321B40"/>

  <text
    x="425"
    y="32"
    text-anchor="middle"
    fill="#76558C"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    SYSTEM // SAVE_POINT
  </text>


  <!-- PIXEL STARS -->

  <text
    x="340"
    y="90"
    text-anchor="middle"
    fill="#76558C"
    font-family="monospace"
    font-size="15"
  >
    +
  </text>

  <text
    x="425"
    y="76"
    text-anchor="middle"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="20"
    filter="url(#softGlow)"
  >
    ✦
  </text>

  <text
    x="510"
    y="90"
    text-anchor="middle"
    fill="#76558C"
    font-family="monospace"
    font-size="15"
  >
    +
  </text>


  <!-- SAVED -->

  <text
    x="425"
    y="125"
    text-anchor="middle"
    fill="#A855F7"
    font-family="monospace"
    font-size="13"
    font-weight="bold"
    letter-spacing="3"
    filter="url(#glow)"
  >
    PROGRESS SAVED
  </text>

  <text
    x="425"
    y="150"
    text-anchor="middle"
    fill="#5F426F"
    font-family="monospace"
    font-size="9"
    letter-spacing="2"
  >
    CHECKPOINT // COMMIT SUCCESSFUL
  </text>


  <!-- MENU -->

  <rect
    x="280"
    y="177"
    width="290"
    height="100"
    rx="8"
    fill="#0D0712"
    stroke="#3D2050"
  />


  <!-- SELECTED OPTION -->

  <rect
    x="303"
    y="195"
    width="244"
    height="31"
    rx="4"
    fill="#14091D"
    stroke="#A855F7"
    stroke-width="1.5"
  />

  <text
    x="325"
    y="215"
    fill="#A855F7"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
    filter="url(#softGlow)"
  >
    &gt;
  </text>

  <text
    x="425"
    y="215"
    text-anchor="middle"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
    letter-spacing="2"
  >
    CONTINUE
  </text>


  <!-- EXIT -->

  <text
    x="425"
    y="255"
    text-anchor="middle"
    fill="#76558C"
    font-family="monospace"
    font-size="11"
    letter-spacing="2"
  >
    EXIT
  </text>


  <!-- BOTTOM -->

  <text
    x="425"
    y="310"
    text-anchor="middle"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    SEE YOU IN THE NEXT COMMIT_
  </text>

</svg>
