<svg
  width="850"
  height="300"
  viewBox="0 0 850 300"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
>

  <!-- =========================
       DEFINITIONS
       ========================= -->

  <defs>

    <!-- Rounded crop for FACE album cover -->
    <clipPath id="albumClip">
      <rect
        x="45"
        y="45"
        width="205"
        height="205"
        rx="10"
      />
    </clipPath>

    <!-- Purple glow -->
    <filter
      id="glow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Softer glow for text -->
    <filter
      id="softGlow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- =========================
       BACKGROUND
       ========================= -->

  <rect
    width="850"
    height="300"
    rx="14"
    fill="#050308"
  />

  <!-- subtle inner panel -->

  <rect
    x="12"
    y="12"
    width="826"
    height="276"
    rx="11"
    fill="#08040D"
  />

  <!-- outer purple border -->

  <rect
    x="2"
    y="2"
    width="846"
    height="296"
    rx="14"
    fill="none"
    stroke="#A855F7"
    stroke-width="2"
  />


  <!-- =========================
       ALBUM COVER
       ========================= -->

  <!-- glow behind cover -->

  <rect
    x="42"
    y="42"
    width="211"
    height="211"
    rx="12"
    fill="none"
    stroke="#A855F7"
    stroke-width="2"
    opacity="0.35"
    filter="url(#glow)"
  />

  <!-- actual FACE artwork -->

  <image
    href="face-cover.jpg"
    xlink:href="face-cover.jpg"
    x="45"
    y="45"
    width="205"
    height="205"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#albumClip)"
  />

  <!-- album border -->

  <rect
    x="45"
    y="45"
    width="205"
    height="205"
    rx="10"
    fill="none"
    stroke="#A855F7"
    stroke-width="1.5"
  />


  <!-- =========================
       NOW PLAYING
       ========================= -->

  <text
    x="305"
    y="60"
    fill="#A855F7"
    font-family="monospace"
    font-size="11"
    font-weight="bold"
    letter-spacing="1"
  >
    NOW PLAYING
  </text>


  <!-- track -->

  <text
    x="305"
    y="105"
    fill="#F5F0FA"
    font-family="monospace"
    font-size="32"
    font-weight="bold"
    letter-spacing="1"
    filter="url(#softGlow)"
  >
    LIKE CRAZY
  </text>


  <!-- artist / album -->

  <text
    x="305"
    y="137"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="14"
    font-weight="bold"
  >
    JIMIN // FACE
  </text>


  <!-- decorative status -->

  <circle
    cx="307"
    cy="157"
    r="3"
    fill="#A855F7"
    filter="url(#glow)"
  />

  <text
    x="318"
    y="161"
    fill="#76558C"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    TRACK_06 // PLAYING
  </text>


  <!-- =========================
       PROGRESS BAR
       ========================= -->

  <!-- background -->

  <rect
    x="305"
    y="181"
    width="465"
    height="5"
    rx="3"
    fill="#24132F"
  />

  <!-- progress -->

  <rect
    x="305"
    y="181"
    width="290"
    height="5"
    rx="3"
    fill="#A855F7"
    filter="url(#glow)"
  />

  <!-- playhead -->

  <circle
    cx="595"
    cy="183.5"
    r="7"
    fill="#F3E8FF"
    filter="url(#glow)"
  />


  <!-- timestamps -->

  <text
    x="305"
    y="211"
    fill="#76558C"
    font-family="monospace"
    font-size="11"
  >
    02:14
  </text>

  <text
    x="770"
    y="211"
    text-anchor="end"
    fill="#76558C"
    font-family="monospace"
    font-size="11"
  >
    03:32
  </text>


  <!-- =========================
       CONTROLS
       ========================= -->

  <!-- previous -->

  <text
    x="500"
    y="252"
    text-anchor="middle"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="21"
  >
    ◀
  </text>

  <!-- pause -->

  <text
    x="538"
    y="252"
    text-anchor="middle"
    fill="#F3E8FF"
    font-family="monospace"
    font-size="24"
    font-weight="bold"
    filter="url(#softGlow)"
  >
    ❚❚
  </text>

  <!-- next -->

  <text
    x="578"
    y="252"
    text-anchor="middle"
    fill="#D8B4FE"
    font-family="monospace"
    font-size="21"
  >
    ▶
  </text>


  <!-- =========================
       BOTTOM STATUS
       ========================= -->

  <text
    x="770"
    y="257"
    text-anchor="end"
    fill="#5F3475"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    SYSTEM://AUDIO_ON
  </text>

</svg>
