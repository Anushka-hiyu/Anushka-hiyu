
<svg width="850" height="300" viewBox="0 0 850 300"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <clipPath id="albumClip">
    <rect x="70" y="55" width="260" height="260" rx="12" />
  </clipPath>
</defs>
  
<defs>
<filter id="glow">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge>
<feMergeNode in="b"/>
