
<svg
    width="1200"
    height="310"
    viewBox="0 0 1200 310"
    xmlns="http://www.w3.org/2000/svg"
>

<defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0D0712"/>
        <stop offset="55%" stop-color="#08040D"/>
        <stop offset="100%" stop-color="#050308"/>
    </linearGradient>

    <filter id="glow"
        x="-30%"
        y="-30%"
        width="160%"
        height="160%"
    >
        <feGaussianBlur
            stdDeviation="2.5"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>


<!-- BACKGROUND -->

<rect
    x="2"
    y="2"
    width="1196"
    height="306"
    rx="14"
    fill="url(#bg)"
    stroke="#A855F7"
    stroke-width="2"
/>

<rect
    x="12"
    y="12"
    width="1176"
    height="286"
    rx="10"
    fill="none"
    stroke="#5F3475"
    opacity="0.45"
/>


<!-- TERMINAL DOTS -->

<circle cx="32" cy="30" r="4" fill="#A855F7"/>

<circle
    cx="48"
    cy="30"
    r="4"
    fill="#D8B4FE"
/>

<circle
    cx="64"
    cy="30"
    r="4"
    fill="#76558C"
/>


<!-- HEADER -->

<text
    x="600"
    y="34"
